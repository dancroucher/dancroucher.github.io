    <body >
        <div class="crt noselect">
            <div id="bg-start" class="bg" style="display: none" onclick=''></div>
            <div id="bg-mp4" class="bg" style="display: none" onclick='' ondblclick="doFullscreen()"><video preload="auto" autoplay muted playsinline loop id="mp4-background"></video></div>
            <div id="bg-youtube" class="bg-youtube" style="display: none" onclick=''></div>
            <div class="title-container" id="title-container" style="display: block">

            </div>
            <div class="song-container" id="song-container" style="display: none">

                    <div class ="song-author" id="song-author"></div><br>
                </div>
                <div class = "padinfo" id="padinfo">
                    <div class ="genre" id="background-type" onclick='changeBackgroundType()'></div>
                    <div class ="background-name" id="background-name" onclick='changeBackground()' style="display: none"></div>
                    <div class ="background-name" id="background-auto" onclick='toggleAuto()' style="display: none"></div>
                    <div class ="info-button" onclick="doPopup()"><i class="fas fa-info-circle"></i></div>
                </div>
            </div>
            <div class="title-container" id="start-container" style="display: block;">
                <div class = "padstart">
                    <div class="start" id="start">
                        <div>Enter Youtube Video or Playlist URL or ID: <br><br>
                            <form>
                                <input class='videobox' type="text" autocomplete="on" id="idEntry" placeholder=""><br><br>
                                <input type="submit" value="Submit" id="demo_start_video" onclick=''>
                            </form>
                        </div>
		            </div>
                </div>
            </div>
        </div>
