<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>jeem-fm</title>
        <meta name="description" content="YouTube player with animated backgrounds">
        <meta name="author" content="jeem">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lacquer&family=Patrick+Hand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="player.css">
        <link rel="stylesheet" href="font.css">
        <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
        <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="jeem-fm" />
        <link rel="manifest" href="/assets/favicon/site.webmanifest" />
        <script src="https://kit.fontawesome.com/c71940ba40.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <div class="crt vignette noselect">
            <div id="bg-mp4" class="bg">
                <video autoplay muted playsinline loop id="mp4-background-a" class="bg-video active"></video>
                <video muted playsinline loop id="mp4-background-b" class="bg-video"></video>
            </div>
            <div id="bg-none" class="bg-none"></div>
            <div id="bg-transition"></div>

            <div id="tape-deck" style="display: none"></div>
            <div id="tapes-root"></div>

            <div class="title-container" id="title-container" style="display: none">
                <div class="padtitle">
                    <div class="title" id="title"><a href=".">// jeem-fm</a></div>
                </div>
            </div>

            <div class="song-container" id="song-container" style="display: none">
                <div class="padsong">
                    <div class="song-name" id="song-name"></div><br>
                    <div class="song-author" id="song-author"></div><br>
                </div>
            </div>

            <div class="padinfo" id="padinfo" style="display: none">
                <div class="genre" id="background-type"></div>
                <div class="genre" id="background-auto"></div>
                <div class="padinfo-row">
                    <div class="genre" id="playlist-prev"><a><i class="fa fa-fast-backward"></i></a></div>
                    <div class="genre-nohover" id="track-number"></div>
                    <div class="genre" id="playlist-next"><a><i class="fa fa-fast-forward"></i></a></div>
                </div>
                <div class="padinfo-row">
                    <div class="fullscreen-button" id="fullscreen-btn"><i class="fas fa-arrows-alt fa-rotate-45"></i></div>
                    <div class="info-button" id="info-btn"><i class="fas fa-info-circle"></i></div>
                </div>
            </div>

            <div class="pause-overlay" id="pause-overlay"><i class="fas fa-pause"></i></div>

            <div class="loading-overlay" id="loading-overlay">
                <i class="fas fa-spinner fa-spin"></i>
                <div class="loading-text"></div>
            </div>

            <div id="bg-youtube" class="bg-youtube" style="display: none"></div>

            <div class="start-container" id="start-container" style="display: none;">
                <div class="start-header">
                    <div class="start-title"><a href=".">// jeem-fm</a></div>
                    <div id="username-area"></div>
                    <div class="start-form">
                        <form id="video-form">
                            <input class="videobox" type="text" autocomplete="on" id="idEntry" placeholder="paste url or search...">
                        </form>
                            <button class="infinite-btn" id="infinite-btn" title="Create infinite tape">∞</button>
                        <div class="infinite-popup" id="infinite-popup" style="display: none">
                            <div class="infinite-popup-title">∞ infinite tape</div>
                            <input type="hidden" id="inf-source" value="youtube">
                            <div class="infinite-row">
                                <label>type</label>
                                <select id="inf-type">
                                    <option value="decade">Decade</option>
                                    <option value="genre">Genre</option>
                                    <option value="artist">Artist</option>
                                    <option value="year">Year</option>
                                </select>
                            </div>
                            <div class="infinite-row" id="inf-value-row">
                                <label>value</label>
                                <select id="inf-value-decade">
                                    <option value="1960">1960s</option>
                                    <option value="1970">1970s</option>
                                    <option value="1980" selected>1980s</option>
                                    <option value="1990">1990s</option>
                                    <option value="2000">2000s</option>
                                    <option value="2010">2010s</option>
                                    <option value="2020">2020s</option>
                                </select>
                                <input type="text" id="inf-value-genre" style="display: none" placeholder="e.g. rock, pop, jazz">
                                <input type="text" id="inf-value-text" style="display: none" placeholder="e.g. 1985 or artist name">
                            </div>
                            <button class="infinite-create" id="inf-create">create tape</button>
                            <button class="infinite-create" id="inf-lucky" style="background: #b8860b; margin-top: 4px">🎲 lucky pick</button>
                            <button class="infinite-create" id="inf-mixtape" style="background: linear-gradient(135deg, #8a5a20, #c9a84c); margin-top: 4px; color: #0a0805; font-weight: bold">+ mixtape</button>
                        </div>
                    </div>
                </div>
                <div class="history-container" id="saved-videos-container" style="display:none"></div>
            </div>
        </div>

        <div class="popup">
            <span class="popuptext" id="myPopup">
     _                       ___
    (_)___  ___  __ _  ____ / _/__ _
   / // -_)/ -_)/  ' \/___// _//  ' \
__/ / \__/ \__//_/_/_/    /_/ /_/_/_/
|___/

<span id="info"></span>
            </span>
        </div>

        <script src="src/youtube_iframe_api.js"></script>
        <script src="src/script.js"></script>
        <script src="src/demo.js"></script>
        <script src="src/player.js"></script>
        <script type="module" src="dist/tapes.js"></script>
        <script>
        // Load mixtape bundle for creator and saved tape views only.
        // NOT for ?mixtape=1 — that route is handled by TapesTable directly.
        (function() {
          var params = new URLSearchParams(window.location.search);
          if (params.get('create_mixtape') === '1' || params.has('tape')) {
            // Load YouTube Iframe API first
            var tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            var first = document.getElementsByTagName('script')[0];
            first.parentNode.insertBefore(tag, first);
            // Load mixtape bundle after YT API
            var mixtapeScript = document.createElement('script');
            mixtapeScript.type = 'module';
            mixtapeScript.src = 'dist/mixtape.js';
            mixtapeScript.onload = function() { console.log('[mixtape] loaded'); };
            mixtapeScript.onerror = function() { console.error('[mixtape] failed to load'); };
            document.head.appendChild(mixtapeScript);
          }
        })();
        </script>
    </body>
</html>
